name: PC optimizer release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run audit:high
      - name: Verify signed release provenance
        env:
          RNK_SIGNING_KEY_FINGERPRINT: ${{ vars.RNK_SIGNING_KEY_FINGERPRINT }}
        run: |
          test -n "$RNK_SIGNING_KEY_FINGERPRINT"
          node scripts/verify-release-provenance.mjs
      - name: Import release signing key
        env:
          RNK_RELEASE_PUBLIC_KEY: ${{ secrets.RNK_RELEASE_PUBLIC_KEY }}
        run: |
          test -n "$RNK_RELEASE_PUBLIC_KEY"
          printf '%s\n' "$RNK_RELEASE_PUBLIC_KEY" | gpg --batch --import
      - name: Recheck exact release signer
        env:
          RNK_SIGNING_KEY_FINGERPRINT: ${{ vars.RNK_SIGNING_KEY_FINGERPRINT }}
        run: |
          test -n "$RNK_SIGNING_KEY_FINGERPRINT"
          git verify-tag --raw "$GITHUB_REF_NAME" | grep -E "VALIDSIG ${RNK_SIGNING_KEY_FINGERPRINT}"
      - run: npm run verify
      - run: git archive --format=tar.gz --prefix=rnk-vq1-optimizer-pc-${GITHUB_REF_NAME}/ --output=rnk-vq1-optimizer-pc-${GITHUB_REF_NAME}.tar.gz "${GITHUB_SHA}"
      - run: sha256sum "rnk-vq1-optimizer-pc-${GITHUB_REF_NAME}.tar.gz" > "rnk-vq1-optimizer-pc-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Build and verify runtime bundles
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          for platform in linux darwin win32; do
            output="$RUNNER_TEMP/rnk-runtime-$platform"
            archive="rnk-vq1-optimizer-pc-runtime-${platform}-${GITHUB_REF_NAME}.tar.gz"
            node scripts/workstation-package.js --platform "$platform" --source "$GITHUB_WORKSPACE" --output "$output" --version "$version"
            node scripts/workstation-package.js --verify --source "$output"
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf "$archive" -C "$output" .
            sha256sum "$archive" > "$archive.sha256"
          done
      - name: Write release provenance
        run: |
          node --input-type=module -e "import { writeFile } from 'node:fs/promises'; await writeFile('provenance.json', JSON.stringify({ repository: process.env.GITHUB_REPOSITORY, tag: process.env.GITHUB_REF_NAME, commit: process.env.GITHUB_SHA, archive: 'rnk-vq1-optimizer-pc-' + process.env.GITHUB_REF_NAME + '.tar.gz' }, null, 2) + '\\n');"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: rnk-vq1-optimizer-pc-${{ github.ref_name }}.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "rnk-vq1-optimizer-pc-${GITHUB_REF_NAME}.tar.gz" "rnk-vq1-optimizer-pc-${GITHUB_REF_NAME}.tar.gz.sha256" rnk-vq1-optimizer-pc-runtime-linux-${GITHUB_REF_NAME}.tar.gz rnk-vq1-optimizer-pc-runtime-linux-${GITHUB_REF_NAME}.tar.gz.sha256 rnk-vq1-optimizer-pc-runtime-darwin-${GITHUB_REF_NAME}.tar.gz rnk-vq1-optimizer-pc-runtime-darwin-${GITHUB_REF_NAME}.tar.gz.sha256 rnk-vq1-optimizer-pc-runtime-win32-${GITHUB_REF_NAME}.tar.gz rnk-vq1-optimizer-pc-runtime-win32-${GITHUB_REF_NAME}.tar.gz.sha256 provenance.json --verify-tag --generate-notes
