name: PC optimizer verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - run: npm run audit:prod
      - run: npm run audit:high
      - run: npm run bench -- --json
      - run: for file in native/*.mjs scripts/*.mjs; do node --check "$file"; done
      - run: bash -n install/linux/install.sh
      - name: Reject private-stack references
        run: |
          if rg -n -i 'foundry|vortex quantum|scripts/vq|check-pc-vq1|pc-host\.js' \
            --glob '!package-lock.json' --glob '!.git/**' --glob '!.github/**' .; then
            echo 'private-stack reference found in public checkout' >&2
            exit 1
          fi
      - run: git diff --check

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse Windows installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'install/windows/install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Output 'PowerShell parse OK'
